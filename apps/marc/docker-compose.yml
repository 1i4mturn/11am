services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marc-postgres
    environment:
      POSTGRES_USER: marc
      POSTGRES_PASSWORD: marc
      POSTGRES_DB: marc
    ports:
      - "5434:5432"
    volumes:
      - marc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marc -d marc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marc_pgdata:
