services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 11am-postgres
    environment:
      POSTGRES_USER: elevenam
      POSTGRES_PASSWORD: elevenam
      POSTGRES_DB: elevenam
    ports:
      - "5435:5432"
    volumes:
      - elevenam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevenam -d elevenam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  elevenam_pgdata:
