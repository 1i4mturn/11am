services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: william-postgres
    environment:
      POSTGRES_USER: william
      POSTGRES_PASSWORD: william
      POSTGRES_DB: william
    ports:
      - "5433:5432"
    volumes:
      - william_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U william -d william"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  william_pgdata:
