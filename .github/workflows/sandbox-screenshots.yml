name: Sandbox screenshots

# Builds the sandbox, launches it in a few states and captures the screen.
# Runs on demand, or on a push whose commit message contains [shots].
on:
  push:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-screenshots.yml"
  workflow_dispatch:

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        working-directory: sandbox
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project ElevenAm.xcodeproj -scheme ElevenAm -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error:|BUILD" || true
          test -f build/Build/Products/Debug/ElevenAm.app/Contents/MacOS/ElevenAm

      - name: Put a busy desktop behind the app
        working-directory: sandbox
        run: |
          swiftc -O ci/Backdrop.swift -o backdrop
          ./backdrop > backdrop.log 2>&1 &
          sleep 3

      - name: Capture
        working-directory: sandbox
        run: |
          mkdir -p shots
          APP="build/Build/Products/Debug/ElevenAm.app/Contents/MacOS/ElevenAm"
          capture() {
            name="$1"; shift
            "$APP" -activate YES "$@" > "shots/$name.log" 2>&1 &
            pid=$!
            sleep "${WAIT:-9}"
            screencapture -x "shots/$name.png" || echo "screencapture failed for $name"
            if ! kill -0 "$pid" 2>/dev/null; then echo "App exited early for $name"; cat "shots/$name.log"; fi
            kill "$pid" 2>/dev/null || true
            sleep 2
          }
          capture today-light -startSection today -forceAppearance light
          capture today-energy-light -startSection today -forceAppearance light -phoneEnergy YES
          capture photo-light -startSection photo -forceAppearance light
          capture photo-crop-dark -startSection photo -forceAppearance dark -photoTool crop
          capture photo-film-light -startSection photo -forceAppearance light -photoLook Film
          WAIT=20 capture video-light -startSection video -forceAppearance light -videoSample YES
          WAIT=20 capture video-graded-dark -startSection video -forceAppearance dark -videoSample YES -videoLook "Teal & orange" -videoTab colour
          capture video-empty-light -startSection video -forceAppearance light
          WAIT=25 capture video-titles-light -startSection video -forceAppearance light -videoSample YES -videoExtras YES -videoTab titles
          WAIT=25 capture video-music-dark -startSection video -forceAppearance dark -videoSample YES -videoExtras YES -videoTab sound
          WAIT=40 capture audio-light -startSection audio -forceAppearance light -audioClip YES
          WAIT=14 capture audio-silences-dark -startSection audio -forceAppearance dark -audioTab 2
          WAIT=14 capture audio-chapters-light -startSection audio -forceAppearance light -audioTab 3
          capture build-light -startSection build -forceAppearance light
          WAIT=14 capture build-terminal-dark -startSection build -forceAppearance dark -buildTab terminal -terminalRun "printf '\\033[1;32mgreen\\033[0m \\033[38;5;208morange\\033[0m \\033[7minverse\\033[0m\\n'; ls /usr/share | head -12; false"
          capture build-scripts-light -startSection build -forceAppearance light -buildTab scripts
          capture build-automations-light -startSection build -forceAppearance light -buildTab automations
          capture build-tune-dark -startSection build -forceAppearance dark -buildTab tune
          capture design-light -startSection design -forceAppearance light
          capture suite-light -startSection suite -forceAppearance light
          capture mail-light -startSection mail -forceAppearance light
          capture mail-dark -startSection mail -forceAppearance dark
          capture mail-learning-light -startSection mail -forceAppearance light -mailSheet learning
          capture mail-add-dark -startSection mail -forceAppearance dark -mailSheet add
          capture mail-microsoft-light -startSection mail -forceAppearance light -mailSheet add -mailProvider outlook
          capture calendar-light -startSection calendar -forceAppearance light -calendarMode week -calendarEvent kickoff
          capture calendar-dark -startSection calendar -forceAppearance dark -calendarMode week
          capture calendar-month-light -startSection calendar -forceAppearance light -calendarMode month
          capture calendar-agenda-dark -startSection calendar -forceAppearance dark -calendarMode agenda -calendarEvent golive
          capture calendar-new-light -startSection calendar -forceAppearance light -calendarMode day -calendarNew YES
          capture write-light -startSection write -forceAppearance light
          capture write-welcome-dark -startSection write -forceAppearance dark -writeDoc 1
          capture notes-light -startSection notes -forceAppearance light -notesNote "Acme pilot"
          capture notes-dark -startSection notes -forceAppearance dark -notesFolder Work -notesNote "Board deck"
          WAIT=12 capture pdf-light -startSection pdf -forceAppearance light -pdfSample YES
          WAIT=12 capture pdf-pages-dark -startSection pdf -forceAppearance dark -pdfSample YES -pdfMode pages
          capture pdf-empty-light -startSection pdf -forceAppearance light
          capture learn-light -startSection learn -forceAppearance light
          capture learn-spanish-light -startSection learn -forceAppearance light -learnTab languages -languageSample YES
          capture learn-lesson-dark -startSection learn -forceAppearance dark -learnTab languages -languageLesson YES
          capture learn-cards-light -startSection learn -forceAppearance light -learnTab cards
          capture sheets-light -startSection sheets -forceAppearance light -sheetsSelect B2:E7
          capture sheets-sales-dark -startSection sheets -forceAppearance dark -sheetsSheet 1 -sheetsSelect E2:E18
          capture sheets-loan-light -startSection sheets -forceAppearance light -sheetsSheet 2 -sheetsSelect B7
          capture sheets-trip-dark -startSection sheets -forceAppearance dark -sheetsBook "Japan trip"
          capture money-light -startSection money -forceAppearance light
          capture money-bank-light -startSection money -forceAppearance light -moneyTab bank
          capture money-bank-dark -startSection money -forceAppearance dark -moneyTab bank
          capture money-invoices-light -startSection money -forceAppearance light -moneyTab invoices -moneyInvoice INV-0004
          capture money-editor-dark -startSection money -forceAppearance dark -moneyTab invoices -moneyEditor YES
          capture money-bills-light -startSection money -forceAppearance light -moneyTab bills
          capture money-reports-light -startSection money -forceAppearance light -moneyTab reports
          capture money-gst-dark -startSection money -forceAppearance dark -moneyTab gst
          capture design-light -startSection design -forceAppearance light
          capture design-select-dark -startSection design -forceAppearance dark -designSelect 3
          capture design-event-light -startSection design -forceAppearance light -designName Founder -designSelect 3
          capture decks-light -startSection decks -forceAppearance light
          capture decks-chart-dark -startSection decks -forceAppearance dark -decksSlide 5
          WAIT=12 capture decks-present -startSection decks -forceAppearance light -decksSlide 1 -decksPresent YES
          capture notch-dark -startSection suite -forceAppearance dark -openNotch YES
          # Last, because pairing makes every later launch listen for the iPhone (and macOS asks about the local network).
          WAIT=12 capture today-iphone-dark -startSection today -forceAppearance dark -phonePairing YES -phoneEnergy YES
          ls -la shots

      - name: iPhone screenshots (simulator)
        working-directory: sandbox
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project ElevenAm.xcodeproj -scheme ElevenAmPhone -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/phone CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error:|BUILD" || true
          APP=$(find build/phone/Build/Products -name "ElevenAmPhone.app" -maxdepth 2 | head -1)
          echo "App: $APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in sorted(devices.items()) if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          preferred = [d for d in phones if d["name"].endswith(" Pro")] or phones
          print(preferred[-1]["udid"])')
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install "$DEVICE" "$APP"
          shot() {
            name="$1"; shift
            xcrun simctl terminate "$DEVICE" au.elevenam.sandbox.phone 2>/dev/null || true
            xcrun simctl launch "$DEVICE" au.elevenam.sandbox.phone "$@"
            sleep "${WAIT:-7}"
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }
          WAIT=10 shot phone-today-light -phoneSample YES -phoneTab today -phoneAppearance light
          shot phone-energy-light -phoneSample YES -phoneTab energy -phoneAppearance light
          shot phone-energy-dark -phoneSample YES -phoneTab energy -phoneAppearance dark
          shot phone-capture-light -phoneSample YES -phoneTab capture -phoneAppearance light
          shot phone-mac-light -phoneTab mac -phoneAppearance light
          shot phone-energy-empty-dark -phoneTab energy -phoneAppearance dark
          ls -la shots | grep phone

      - name: Publish to the ci/sandbox-shots branch
        working-directory: sandbox/shots
        run: |
          sips -Z 1600 *.png > /dev/null
          git init -q
          git checkout -q -b ci/sandbox-shots
          git add .
          git -c user.name="sandbox-ci" -c user.email="sandbox-ci@users.noreply.github.com" commit -q -m "Sandbox screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci/sandbox-shots

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-screenshots
          path: sandbox/shots
          retention-days: 7
