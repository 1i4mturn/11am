name: Sandbox build

on:
  push:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-build.yml"
  workflow_dispatch:

concurrency:
  group: sandbox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: sandbox
        run: xcodegen generate

      - name: Build
        working-directory: sandbox
        run: |
          set -o pipefail
          xcodebuild \
            -project ElevenAm.xcodeproj \
            -scheme ElevenAm \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Mail, learning and calendar tests
        working-directory: sandbox
        run: |
          mkdir -p mailtest
          cd mailtest
          python3 ../ci/fake_mail_server.py > server.log 2>&1 &
          sleep 1
          swiftc -O -o mailtests \
            ../ElevenAm/Features/Mail/{MailTypes,MailSocket,IMAPClient,SMTPClient,MailParser,MailTriage,MailLearner,MailSync,MailSamples,MicrosoftAuth}.swift \
            ../ElevenAm/Features/Calendar/{CalendarKit,MicrosoftCalendar}.swift \
            ../ci/MailTests/main.swift 2>&1 | grep -E "error|warning: unre" || true
          test -x mailtests
          TZ=Australia/Sydney ./mailtests

      - name: Document and PDF tests
        working-directory: sandbox
        run: |
          mkdir -p doctest
          cd doctest
          swiftc -O -o doctests \
            ../ElevenAm/Features/Documents/{DocumentKit,DocxWriter,DocRender}.swift \
            ../ElevenAm/Features/PDF/PDFEngine.swift \
            ../ci/DocTests/main.swift 2>&1 | grep -E "error|warning: unre" || true
          test -x doctests
          ./doctests

      - name: Grid tests
        working-directory: sandbox
        run: |
          mkdir -p gridtest
          cd gridtest
          swiftc -O -o gridtests \
            ../ElevenAm/Features/Sheets/{GridKit,GridFormula,GridEngine,GridEdit,GridFiles}.swift \
            ../ElevenAm/Features/Documents/{DocumentKit,DocxWriter}.swift \
            ../ci/GridTests/main.swift 2>&1 | grep -E "error|warning: unre" || true
          test -x gridtests
          TZ=Australia/Sydney ./gridtests

      - name: Ledger tests
        working-directory: sandbox
        run: |
          mkdir -p ledgertest
          cd ledgertest
          swiftc -O -o ledgertests \
            ../ElevenAm/Features/Money/{LedgerKit,LedgerSamples}.swift \
            ../ElevenAm/Features/Sheets/{GridKit,GridFormula,GridEngine,GridEdit,GridFiles}.swift \
            ../ElevenAm/Features/Documents/{DocumentKit,DocxWriter}.swift \
            ../ci/LedgerTests/main.swift 2>&1 | grep -E "error|warning: unre" || true
          test -x ledgertests
          TZ=Australia/Sydney ./ledgertests
