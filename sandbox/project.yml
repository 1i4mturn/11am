name: ElevenAm
options:
  bundleIdPrefix: au.elevenam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ElevenAm:
    type: application
    platform: macOS
    sources:
      - path: ElevenAm
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: 11am
        CFBundleDisplayName: 11am
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: 11am sandbox build
        NSCalendarsFullAccessUsageDescription: Leo shows and edits your calendars in 11am, and uses today's events for your brief and the 11am check-in. Nothing leaves your Mac unless you allow cloud help.
        NSCalendarsUsageDescription: Leo shows and edits your calendars in 11am, and uses today's events for your brief.
        NSRemindersFullAccessUsageDescription: Leo shows reminders that are due on your calendar, so you can tick them off there.
        NSRemindersUsageDescription: Leo shows reminders that are due on your calendar.
        NSAppleEventsUsageDescription: Bolton reads your Apple Notes once, when you choose to import them into 11am. Your Apple Notes aren't changed.
        NSSpeechRecognitionUsageDescription: Video transcribes your recordings on this Mac so you can edit them by editing the words.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: ElevenAm
        PRODUCT_BUNDLE_IDENTIFIER: au.elevenam.sandbox
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
