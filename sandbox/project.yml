name: ElevenAm
options:
  bundleIdPrefix: au.elevenam
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.22.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ElevenAm:
    type: application
    platform: macOS
    sources:
      - path: ElevenAm
      - path: Shared
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: 11am
        CFBundleDisplayName: 11am
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: 11am sandbox build
        NSCalendarsFullAccessUsageDescription: Leo shows and edits your calendars in 11am, and uses today's events for your brief and the 11am check-in. Nothing leaves your Mac unless you allow cloud help.
        NSCalendarsUsageDescription: Leo shows and edits your calendars in 11am, and uses today's events for your brief.
        NSRemindersFullAccessUsageDescription: Leo shows reminders that are due on your calendar, so you can tick them off there.
        NSRemindersUsageDescription: Leo shows reminders that are due on your calendar.
        NSAppleEventsUsageDescription: Bolton reads your Apple Notes once when you import them, and the scripts and automations you run in Build control only the apps you've allowed.
        NSMicrophoneUsageDescription: Cole records your voice into Audio and Video when you press Record. Recordings stay on this Mac.
        NSSpeechRecognitionUsageDescription: Video transcribes your recordings on this Mac so you can edit them by editing the words.
        NSLocalNetworkUsageDescription: Your iPhone finds 11am on this Mac over your own network to send what you capture and your Energy summary.
        NSBonjourServices:
          - _11am._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: ElevenAm
        PRODUCT_BUNDLE_IDENTIFIER: au.elevenam.sandbox
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
  ElevenAmPhone:
    type: application
    platform: iOS
    sources:
      - path: Phone
      - path: Shared
    info:
      path: Support/Phone-Info.plist
      properties:
        CFBundleName: 11am
        CFBundleDisplayName: 11am
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: au.elevenam.pair
            CFBundleURLSchemes:
              - elevenam
        NSHealthShareUsageDescription: Leo reads your sleep, steps, activity, heart rate and workouts to plan your day around how you slept. It only reads, and only a short daily summary goes to your own Mac.
        NSHealthUpdateUsageDescription: 11am doesn't write to Apple Health.
        NSCameraUsageDescription: Scan documents and take photos to send to 11am on your Mac, and scan the pairing code your Mac shows.
        NSMicrophoneUsageDescription: Record voice notes that go to Notes on your Mac.
        NSSpeechRecognitionUsageDescription: Voice notes are transcribed on this iPhone so the words arrive in Notes with the recording.
        NSPhotoLibraryUsageDescription: Choose a photo to send to 11am on your Mac.
        NSLocalNetworkUsageDescription: 11am finds your Mac on your own Wi-Fi to send what you capture and your Energy summary, and to show your brief.
        NSBonjourServices:
          - _11am._tcp
    entitlements:
      path: Support/Phone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: ElevenAmPhone
        PRODUCT_BUNDLE_IDENTIFIER: au.elevenam.sandbox.phone
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

